spring:
  application:
    name: unified-todo-center

  datasource:
    url: jdbc:mysql://localhost:3306/unified_todo?useSSL=false&useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # Flyway 数据库版本管理配置
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
    encoding: UTF-8
    validate-on-migrate: true

# Camunda 引擎配置
camunda:
  bpm:
    database:
      schema-update: false  # 由Flyway统一管理表结构
    history-level: full
    admin-user:
      id: admin
      password: admin123
      first-name: 系统
      last-name: 管理员
    filter:
      create: All tasks
    authorization:
      enabled: false  # 开发环境关闭权限控制
    job-execution:
      enabled: true
      core-pool-size: 5
      max-pool-size: 10
      queue-capacity: 100
    webapp:
      index-redirect-enabled: true

# 统一待办中心自定义配置
todo:
  center:
    app-name: 企业统一待办中心
    notify:
      default-channels: wechat,dingtalk,feishu
      retry-count: 3
    sla:
      auto-escalate-enabled: true
      check-interval-ms: 300000  # 每5分钟扫描一次超时待办

server:
  port: 8080
  servlet:
    context-path: /todo-api
